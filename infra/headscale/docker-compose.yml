# SPDX-License-Identifier: Apache-2.0
# Self-hosted Headscale for Cialai. Generate config/config.yaml with
# ./bootstrap.sh before starting the service.
name: cialai-headscale

services:
  headscale:
    image: headscale/headscale:0.29.3@sha256:0e7f1c6e4ce6c2a2a001103ecd3fa645a045adf30ac8a5234fe037b43000cd72
    command: ["serve"]
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
      - "3478:3478/udp"
    volumes:
      - ./config:/etc/headscale:ro
      - headscale-data:/var/lib/headscale
    tmpfs:
      - /var/run/headscale
    healthcheck:
      # The image has no shell or curl; the bundled CLI checks the server.
      test: ["CMD", "/ko-app/headscale", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  headscale-data:
