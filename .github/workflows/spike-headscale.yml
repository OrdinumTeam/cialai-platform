# SPDX-License-Identifier: Apache-2.0
name: Phase 0 Headscale spike

# Só disparo manual desde 30/09/2026: push, PR e agenda não rodam mais sozinhos,
# e o job confere quem disparou.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-and-expiry:
    # Só o dono do projeto dispara; ver docs/engenharia/10-ci-cd-e-distribuicao.md.
    if: contains(fromJSON('["ordinum-br","focoamorim"]'), github.triggering_actor)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/tunnel-core/go.mod
          cache-dependency-path: packages/tunnel-core/go.sum
      - run: docker pull headscale/headscale:0.29.3
      - run: go vet -tags=integration ./spikes/headscale
        working-directory: packages/tunnel-core
      - run: go test -mod=readonly -tags=integration -count=1 -timeout=6m -v ./spikes/headscale
        working-directory: packages/tunnel-core
