# SPDX-License-Identifier: Apache-2.0
name: AppImage smoke

on:
  pull_request:
    paths:
      - .github/workflows/appimage-smoke.yml
      - .github/workflows/release.yml
      - tools/release/fix-appimage.mjs
      - tools/release/appimage/**
      - tools/release/verify-updater-signature.mjs
      - tools/fetch-tor.mjs
      - apps/desktop/package.json
      - apps/desktop/src-tauri/Cargo.lock
      - apps/desktop/src-tauri/tauri.conf.json
      - apps/desktop/src-tauri/tauri.linux.conf.json
      # O smoke confere que o sidecar nasce de dentro da imagem; quem o localiza é o supervisor.
      - apps/desktop/src-tauri/src/tunnel/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appimage-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: AppImage corrigido
    # PR roda só no repositório público; o disparo manual vale nos dois.
    if: github.event_name == 'workflow_dispatch' || github.repository == 'Cialai/cialai'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do desktop no Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.8

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/tunnel-core/go.mod
          cache-dependency-path: packages/tunnel-core/go.sum

      - name: Instalar dependências
        run: npm ci

      - name: Cache do Tor Expert Bundle
        uses: actions/cache@v4
        with:
          path: packages/tunnel-core/build/tor/downloads
          key: tor-expert-bundle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/fetch-tor.mjs') }}

      # O mesmo bundle do job Linux do ci.yml, só com o alvo AppImage.
      - name: Criar o AppImage sem assinatura
        env:
          TOR_LIBRARIES: ${{ github.workspace }}/apps/desktop/src-tauri/resources/tor/tor
        run: LD_LIBRARY_PATH="$TOR_LIBRARIES${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" npm run build --workspace @cialai/desktop -- --config src-tauri/tauri.ci.conf.json --bundles appimage

      - name: Corrigir o AppImage para distribuições novas
        run: node tools/release/fix-appimage.mjs apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage

      # A mesma sequência do release.yml com uma chave descartável, sem secrets: assinar o arquivo final e
      # conferir a assinatura como o atualizador do app confere.
      - name: Assinar com chave descartável e conferir
        working-directory: apps/desktop
        run: |
          key="$RUNNER_TEMP/updater/cialai.key"
          appimage=("$GITHUB_WORKSPACE"/apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage)
          npx tauri signer generate --ci -p smoke -w "$key"
          TAURI_SIGNING_PRIVATE_KEY="$(cat "$key")" TAURI_SIGNING_PRIVATE_KEY_PASSWORD=smoke npx tauri signer sign "${appimage[0]}"
          node "$GITHUB_WORKSPACE/tools/release/verify-updater-signature.mjs" "${appimage[0]}" --public-key "$(cat "$key.pub")"

      - uses: actions/upload-artifact@v4
        with:
          name: cialai-appimage
          path: apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7

  ubuntu:
    name: Smoke / ubuntu-24.04
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cialai-appimage
          path: appimage

      # Desktop Ubuntu recente: Mesa, WebKitGTK e GVfs do sistema, com módulos GIO de uma GLib mais nova que a do bundle.
      - name: Pacotes de desktop do Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth x11-utils imagemagick fuse3 \
            libgl1-mesa-dri libegl1 libgbm1 libwebkit2gtk-4.1-0 gvfs

      - name: AppImage aberto sob Xvfb
        run: tools/release/appimage/smoke.sh appimage/*.AppImage 20 smoke-logs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appimage-smoke-ubuntu-24.04
          path: smoke-logs
          if-no-files-found: ignore
          retention-days: 14

  arch:
    name: Smoke / archlinux
    needs: bundle
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 25
    steps:
      # Mesa, WebKitGTK e GVfs do Arch, a combinação do relatório de 14/09/2026; o git serve ao checkout.
      - name: Pacotes de desktop do Arch
        run: pacman -Syu --noconfirm --needed git mesa webkit2gtk-4.1 gvfs xorg-server-xvfb xorg-xauth xorg-xwininfo imagemagick procps-ng

      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cialai-appimage
          path: appimage

      - name: Dependências do Mesa fora do bundle
        run: tools/release/appimage/mesa-conflicts.sh appimage/*.AppImage

      - name: AppImage aberto sob Xvfb
        run: tools/release/appimage/smoke.sh appimage/*.AppImage 20 smoke-logs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appimage-smoke-archlinux
          path: smoke-logs
          if-no-files-found: ignore
          retention-days: 14
