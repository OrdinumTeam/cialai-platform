# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do desktop no Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            zsh

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.8

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/tunnel-core/go.mod
          cache-dependency-path: packages/tunnel-core/go.sum

      - name: Instalar dependências
        run: npm ci

      - name: Compilar sidecar local
        run: npm run sidecar --workspace @cialai/desktop

      - name: Executar suítes
        run: npm test

      - name: Conferir texto visível
        if: runner.os == 'Linux'
        run: npm run check:text

      - name: Preparar Playwright e Chromium
        if: runner.os == 'Linux'
        run: |
          npm ci --prefix tools/browser
          node tools/browser/node_modules/playwright/cli.js install --with-deps chromium

      - name: Checks de navegador
        if: runner.os == 'Linux'
        run: npm run test:browser

      # A CI não recebe a chave do atualizador; o bundle sai sem os arquivos assinados do updater.
      - name: Criar bundle sem assinatura
        run: npm run build --workspace @cialai/desktop -- --config src-tauri/tauri.ci.conf.json

      - name: Anexar bundles
        uses: actions/upload-artifact@v4
        with:
          name: cialai-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
