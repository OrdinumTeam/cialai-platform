# SPDX-License-Identifier: Apache-2.0
name: Nightly E2E

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  selftest:
    name: Self test / ${{ matrix.os }}
    # A agenda diária roda só no repositório público; no privado o nightly fica manual.
    if: github.event_name != 'schedule' || github.repository == 'Cialai/cialai'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    # O Windows compila o app duas vezes, em debug e em release.
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TERM_COLOR: always
      TAURI_DRIVER_VERSION: 2.0.6
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do desktop e do WebDriver no Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            zsh \
            webkit2gtk-driver \
            xvfb

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.8

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/tunnel-core/go.mod
          cache-dependency-path: packages/tunnel-core/go.sum

      - name: Instalar dependências
        run: npm ci

      - name: Instalar tauri-driver
        run: cargo install tauri-driver --locked --version ${{ env.TAURI_DRIVER_VERSION }}

      - name: Instalar o Edge WebDriver da versão do WebView2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty -Path $key -Name pv).pv
          if (-not $version) { throw 'Versão do WebView2 não encontrada' }
          $zip = Join-Path $env:RUNNER_TEMP 'edgedriver_win64.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'msedgedriver'
          Invoke-WebRequest -Uri "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          & (Join-Path $dir 'msedgedriver.exe') --version
          $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Compilar sidecar local
        run: npm run sidecar --workspace @cialai/desktop

      - name: Compilar o app de depuração
        run: npm run build --workspace @cialai/desktop -- --debug --no-bundle

      - name: Self test no Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:selftest:driver -- --artifacts selftest-artifacts

      - name: Self test no Windows
        if: runner.os == 'Windows'
        run: npm run test:selftest:driver -- --artifacts selftest-artifacts

      # Em release o app é subsistema GUI, sem console: um filho de console criado sem CREATE_NO_WINDOW abre uma
      # janela. O binário de debug herda o console do runner e nunca mostra isso, então o self test roda de novo
      # sobre o release enquanto um vigia registra toda janela de console nova durante a execução.
      - name: Compilar o app de release no Windows
        if: runner.os == 'Windows'
        run: npm run build --workspace @cialai/desktop -- --no-bundle

      - name: Self test no Windows sobre o binário de release, contando janelas de console
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Join-Path $env:GITHUB_WORKSPACE 'apps\desktop\src-tauri\target\release\cialai-desktop.exe'
          if (-not (Test-Path $app)) { throw "Binário de release ausente em $app" }
          $watch = Join-Path $env:RUNNER_TEMP 'console-windows.ps1'
          $seen = Join-Path $env:RUNNER_TEMP 'console-windows.txt'
          $stop = Join-Path $env:RUNNER_TEMP 'console-windows.stop'
          Remove-Item $seen, $stop -ErrorAction SilentlyContinue
          @'
          param($seen, $stop)
          Add-Type -TypeDefinition @"
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class ConsoleWindows {
            public delegate bool EnumProc(IntPtr hWnd, IntPtr lParam);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc callback, IntPtr lParam);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr hWnd);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetClassName(IntPtr hWnd, StringBuilder name, int count);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetWindowText(IntPtr hWnd, StringBuilder text, int count);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr hWnd, out uint pid);
            public static Dictionary<long, string> Visible() {
              var found = new Dictionary<long, string>();
              EnumWindows((hWnd, lParam) => {
                if (!IsWindowVisible(hWnd)) return true;
                var name = new StringBuilder(256);
                GetClassName(hWnd, name, name.Capacity);
                if (name.ToString() != "ConsoleWindowClass") return true;
                var title = new StringBuilder(512);
                GetWindowText(hWnd, title, title.Capacity);
                uint pid;
                GetWindowThreadProcessId(hWnd, out pid);
                found[hWnd.ToInt64()] = "pid " + pid + " " + title;
                return true;
              }, IntPtr.Zero);
              return found;
            }
          }
          "@
          $baseline = [ConsoleWindows]::Visible()
          $reported = @{}
          while (-not (Test-Path $stop)) {
            foreach ($entry in [ConsoleWindows]::Visible().GetEnumerator()) {
              if ($baseline.ContainsKey($entry.Key) -or $reported.ContainsKey($entry.Key)) { continue }
              $reported[$entry.Key] = $true
              Add-Content -Path $seen -Value ("janela de console nova: handle " + $entry.Key + " " + $entry.Value)
            }
            Start-Sleep -Milliseconds 500
          }
          '@ | Set-Content -Path $watch -Encoding utf8
          $watcher = Start-Job -FilePath $watch -ArgumentList $seen, $stop
          Start-Sleep -Seconds 3
          npm run test:selftest:driver -- --app $app --artifacts selftest-release-artifacts
          $selftest = $LASTEXITCODE
          New-Item -ItemType File -Path $stop -Force | Out-Null
          Wait-Job $watcher -Timeout 30 | Out-Null
          Receive-Job $watcher
          Remove-Job $watcher -Force
          if (Test-Path $seen) {
            Get-Content $seen
            Copy-Item $seen selftest-release-artifacts\console-windows.txt -ErrorAction SilentlyContinue
            throw 'O app de release abriu janelas de console durante o self test'
          }
          Write-Host 'Nenhuma janela de console nova durante o self test de release'
          exit $selftest

      - name: Anexar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: warn
          path: |
            selftest-artifacts/
            selftest-release-artifacts/
