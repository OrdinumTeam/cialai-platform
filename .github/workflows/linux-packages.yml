# SPDX-License-Identifier: Apache-2.0
name: Linux packages

# Só disparo manual. Os pacotes saem como artefatos, sem publicar release ou
# espelho. O AppImage é opcional e recebe a mesma correção e assinatura da release.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit ou branch a compilar
        required: true
        type: string
      include_appimage:
        description: Incluir AppImage corrigido e assinado junto com deb e rpm
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  packages:
    name: Linux bundles
    # Só o dono do projeto dispara; ver docs/engenharia/10-ci-cd-e-distribuicao.md.
    if: contains(fromJSON('["ordinum-br","focoamorim"]'), github.triggering_actor)
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.8
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: x86_64-unknown-linux-gnu
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/tunnel-core/go.mod
          cache-dependency-path: packages/tunnel-core/go.sum
      - name: Test the Tor library path
        working-directory: packages/tunnel-core
        run: go test -mod=readonly -count=1 -run TestWithLibraryDir ./internal/tor/
      - name: Build the Linux sidecar
        run: |
          node tools/build-tunnel.mjs --target "$TARGET"
          node tools/build-tunnel.mjs --verify --target "$TARGET"
      - name: Stage the pinned Tor Expert Bundle
        run: |
          node tools/fetch-tor.mjs --stage --target "$TARGET"
          node tools/fetch-tor.mjs --verify-resource --target "$TARGET"
      - run: npm ci
      - name: Clipboard and shortcut regressions
        run: node --test packages/ui/scripts/tests/clipboard-system.test.cjs packages/ui/scripts/tests/terminal-clipboard*.test.cjs packages/ui/scripts/tests/keys.test.cjs packages/ui/scripts/tests/windows-paths.test.cjs
      - name: Session restoration regressions
        run: |
          (cd packages/ui && node scripts/check-terminal-sync.mjs)
          npm run build:mobile-resource --workspace @cialai/desktop
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --lib workspace::resume::tests:: -- --test-threads=4
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --lib workspace::terminal::tests::three_cards_keep_proven_conversations_through_snapshot_and_restart -- --exact
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --lib workspace::terminal::tests::proven_conversation_is_not_inherited_by_a_reused_agent_pid -- --exact
      - name: Keep the release build environment
        run: echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/apps/desktop/src-tauri/resources/tor/tor${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Write the release configuration
        run: node tools/release/signing-mode.mjs --target "$TARGET" --config-out apps/desktop/src-tauri/tauri.release.conf.json
      - name: Build the Linux bundles
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          BUNDLES: ${{ inputs.include_appimage && 'deb,rpm,appimage' || 'deb,rpm' }}
        run: npx tauri build --target "$TARGET" --config src-tauri/tauri.release.conf.json --bundles "$BUNDLES" -- --locked
      - name: Fix the AppImage and sign it again
        if: inputs.include_appimage
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          BUNDLE: apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle
        run: |
          appimage=("$GITHUB_WORKSPACE/$BUNDLE"/appimage/*.AppImage)
          test "${#appimage[@]}" -eq 1 && test -f "${appimage[0]}"
          node tools/release/fix-appimage.mjs "${appimage[0]}"
          rm "${appimage[0]}.sig"
          (cd apps/desktop && npx tauri signer sign "${appimage[0]}")
          node tools/release/verify-updater-signature.mjs "${appimage[0]}"
      - name: Check the packaged Tor launcher and the updater signatures
        shell: bash
        env:
          BUNDLE: apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle
        run: |
          deb=("$BUNDLE"/deb/*.deb)
          rpm=("$BUNDLE"/rpm/*.rpm)
          test "${#deb[@]}" -eq 1 && test -f "${deb[0]}" && test "${#rpm[@]}" -eq 1 && test -f "${rpm[0]}"
          node tools/release/verify-updater-signature.mjs "${deb[0]}"
          node tools/release/verify-updater-signature.mjs "${rpm[0]}"
          root="$RUNNER_TEMP/deb"
          dpkg-deb -x "${deb[0]}" "$root"
          grep -q "LD_LIBRARY_PATH=" "$root/usr/bin/cialai-tunnel"
          tor_dir="$root/usr/lib/Cialai/tor/tor"
          env -u LD_LIBRARY_PATH LD_LIBRARY_PATH="$tor_dir" "$tor_dir/tor" --version
      - uses: actions/upload-artifact@v4
        with:
          name: cialai-linux-packages
          path: |
            apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb.sig
            apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm.sig
            apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error
          retention-days: 7
