# SPDX-License-Identifier: Apache-2.0
# Release pipeline for the desktop app. The updater artifacts are signed with
# repository secrets. Platform signing and notarization remain separate.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  updater-check:
    name: Updater release guard
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Require the updater public key and signing secrets
        shell: bash
        run: |
          node tools/release/check-updater.mjs --release
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"

  sidecars:
    name: Tunnel sidecars
    needs: updater-check
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/tunnel-core/go.mod
          cache-dependency-path: packages/tunnel-core/go.sum
      - name: Test tunnel core
        working-directory: packages/tunnel-core
        run: go test -mod=readonly ./...
      - name: Build the five sidecar targets
        run: >-
          node tools/build-tunnel.mjs
          --target aarch64-apple-darwin
          --target x86_64-apple-darwin
          --target x86_64-unknown-linux-gnu
          --target aarch64-unknown-linux-gnu
          --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: cialai-tunnel-sidecars
          path: apps/desktop/src-tauri/binaries/
          if-no-files-found: error
          retention-days: 7

  desktop:
    name: Desktop ${{ matrix.target }}
    needs: sidecars
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.8
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev
      - uses: actions/download-artifact@v4
        with:
          name: cialai-tunnel-sidecars
          path: apps/desktop/src-tauri/binaries
      - name: Verify the sidecar for this target
        shell: bash
        run: |
          node tools/build-tunnel.mjs --verify --target ${{ matrix.target }}
          chmod +x apps/desktop/src-tauri/binaries/cialai-tunnel-* || true
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: npx tauri
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: Cialai ${{ github.ref_name }}
          releaseBody: Rascunho gerado pelo workflow de release. Revise antes de publicar.
          releaseDraft: true
          prerelease: false
