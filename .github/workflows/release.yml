# SPDX-License-Identifier: Apache-2.0
# Release pipeline for the desktop app. Updater artifacts are always signed with repository secrets.
# Platform signing is optional: without Developer ID secrets the macOS bundles get an ad hoc signature,
# and without Azure Trusted Signing the Windows installers ship without Authenticode. Tags below
# v1.0.0 are previews and skip the version 1 gates; stable tags must pass check-release.mjs --release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  guard:
    name: Release guard
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Require the updater public key and signing secrets
        shell: bash
        run: |
          node tools/release/check-updater.mjs --release
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
      - name: Match the tag with the app version
        id: channel
        shell: bash
        run: node tools/release/release-channel.mjs "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Require the version 1 gates for stable releases
        if: steps.channel.outputs.channel == 'stable'
        run: node tools/release/check-release.mjs --release

  sidecars:
    name: Tunnel sidecars
    needs: guard
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/tunnel-core/go.mod
          cache-dependency-path: packages/tunnel-core/go.sum
      - name: Test tunnel core
        working-directory: packages/tunnel-core
        run: go test -mod=readonly ./...
      - name: Build the five sidecar targets
        run: >-
          node tools/build-tunnel.mjs
          --target aarch64-apple-darwin
          --target x86_64-apple-darwin
          --target x86_64-unknown-linux-gnu
          --target aarch64-unknown-linux-gnu
          --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: cialai-tunnel-sidecars
          path: apps/desktop/src-tauri/binaries/
          if-no-files-found: error
          retention-days: 7

  draft:
    name: Draft release
    needs: guard
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Create or reuse the draft release
        id: draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CHANNEL: ${{ needs.guard.outputs.channel }}
        run: node tools/release/release-assets.mjs draft "$RELEASE_TAG" "$CHANNEL" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop ${{ matrix.target }}
    needs: [sidecars, draft]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.8
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev
      - uses: actions/download-artifact@v4
        with:
          name: cialai-tunnel-sidecars
          path: apps/desktop/src-tauri/binaries
      - name: Verify the sidecar for this target
        shell: bash
        run: |
          node tools/build-tunnel.mjs --verify --target ${{ matrix.target }}
          chmod +x apps/desktop/src-tauri/binaries/cialai-tunnel-* || true
      - run: npm ci
      - name: Choose platform signing
        id: signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          WINDOWS_SIGNING_ENDPOINT: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          WINDOWS_SIGNING_ACCOUNT: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
          WINDOWS_SIGNING_PROFILE: ${{ vars.WINDOWS_SIGNING_PROFILE }}
        run: >-
          node tools/release/signing-mode.mjs
          --target ${{ matrix.target }}
          --config-out apps/desktop/src-tauri/tauri.release.conf.json
          >> "$GITHUB_OUTPUT"
      - name: Install the Windows signing tool
        if: steps.signing.outputs.windows == 'trusted-signing'
        run: cargo install trusted-signing-cli --locked
      - name: Build and upload with Developer ID
        if: steps.signing.outputs.macos == 'developer-id'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tauriScript: npx tauri
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json
          releaseId: ${{ needs.draft.outputs.release_id }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseDraft: true
          releaseAssetNamePattern: "[name]_[arch][setup][ext]"
          uploadUpdaterJson: false
          retryAttempts: 1
      - name: Build and upload
        if: steps.signing.outputs.macos != 'developer-id'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          projectPath: apps/desktop
          tauriScript: npx tauri
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json
          releaseId: ${{ needs.draft.outputs.release_id }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseDraft: true
          releaseAssetNamePattern: "[name]_[arch][setup][ext]"
          uploadUpdaterJson: false
          retryAttempts: 1

  publish:
    name: Checksums and publication
    needs: [guard, desktop]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Write latest.json from the signed updater bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node tools/release/release-assets.mjs updater-json "$RELEASE_TAG"
      - name: Verify installers and updater files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node tools/release/release-assets.mjs verify "$RELEASE_TAG"
      - name: Write SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node tools/release/release-assets.mjs checksums "$RELEASE_TAG"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node tools/release/release-assets.mjs publish "$RELEASE_TAG"
