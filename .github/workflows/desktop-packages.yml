# SPDX-License-Identifier: Apache-2.0
name: Windows and macOS packages

# Manual, artifact-only distribution. No tag, GitHub release or announcement.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Full commit SHA or branch to build
        required: true
        type: string
      target:
        description: Platform to build, or all platforms
        required: false
        type: choice
        default: all
        options:
          - all
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-pc-windows-msvc

permissions:
  contents: read

jobs:
  packages:
    name: Packages / ${{ matrix.target }}
    if: contains(fromJSON('["ordinum-br","focoamorim"]'), github.triggering_actor)
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
            inputs.target == 'aarch64-apple-darwin' && '[{"os":"macos-14","target":"aarch64-apple-darwin"}]' ||
            inputs.target == 'x86_64-apple-darwin' && '[{"os":"macos-14","target":"x86_64-apple-darwin"}]' ||
            inputs.target == 'x86_64-pc-windows-msvc' && '[{"os":"windows-2022","target":"x86_64-pc-windows-msvc"}]' ||
            '[{"os":"macos-14","target":"aarch64-apple-darwin"},{"os":"macos-14","target":"x86_64-apple-darwin"},{"os":"windows-2022","target":"x86_64-pc-windows-msvc"}]'
          ) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@10.9.8
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/tunnel-core/go.mod
          cache-dependency-path: packages/tunnel-core/go.sum
      - name: Build and verify this target's sidecar and pinned Tor bundle
        shell: bash
        run: |
          node tools/build-tunnel.mjs --target ${{ matrix.target }}
          node tools/build-tunnel.mjs --verify --target ${{ matrix.target }}
          node tools/fetch-tor.mjs --stage --target ${{ matrix.target }}
          node tools/fetch-tor.mjs --verify-resource --target ${{ matrix.target }}
      - run: npm ci
      - name: Clipboard and shortcut regressions
        shell: bash
        run: node --test packages/ui/scripts/tests/clipboard-system.test.cjs packages/ui/scripts/tests/terminal-clipboard*.test.cjs packages/ui/scripts/tests/keys.test.cjs packages/ui/scripts/tests/windows-paths.test.cjs
      - name: Prepare native test sidecar when cross-compiling Intel on Apple Silicon
        if: runner.os == 'macOS' && runner.arch == 'ARM64' && matrix.target == 'x86_64-apple-darwin'
        run: node tools/build-tunnel.mjs --target aarch64-apple-darwin
      - name: Session restoration regressions
        shell: bash
        run: |
          (cd packages/ui && node scripts/check-terminal-sync.mjs)
          npm run build:mobile-resource --workspace @cialai/desktop
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --lib workspace::resume::tests:: -- --test-threads=4
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --lib workspace::terminal::tests::three_cards_keep_proven_conversations_through_snapshot_and_restart -- --exact
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --lib workspace::terminal::tests::proven_conversation_is_not_inherited_by_a_reused_agent_pid -- --exact
      - name: Choose platform signing
        id: signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          WINDOWS_SIGNING_ENDPOINT: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          WINDOWS_SIGNING_ACCOUNT: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
          WINDOWS_SIGNING_PROFILE: ${{ vars.WINDOWS_SIGNING_PROFILE }}
        run: >-
          node tools/release/signing-mode.mjs
          --target ${{ matrix.target }}
          --config-out apps/desktop/src-tauri/tauri.release.conf.json
          >> "$GITHUB_OUTPUT"
      - name: Require Developer ID for macOS distribution
        if: runner.os == 'macOS' && steps.signing.outputs.macos != 'developer-id'
        run: exit 1
      - name: Install the Windows signing tool
        if: steps.signing.outputs.windows == 'trusted-signing'
        run: cargo install trusted-signing-cli --locked
      # Tauri signs externalBin but not resources, and notarization rejects any nested Mach-O without Developer ID.
      - name: Sign the nested Tor binaries with Developer ID
        if: steps.signing.outputs.macos == 'developer-id'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/tor-signing.keychain-db"
          certificate="$RUNNER_TEMP/tor-signing.p12"
          keychain_password="$(openssl rand -base64 32)"
          cleanup() {
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -f "$certificate"
          }
          trap cleanup EXIT
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          chmod 600 "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          node tools/fetch-tor.mjs --sign --keychain "$keychain" --target ${{ matrix.target }}
          node tools/fetch-tor.mjs --verify-resource --target ${{ matrix.target }}
      - name: Write the notarization key
        if: steps.signing.outputs.macos == 'developer-id'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          key_path="$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          mkdir -p "$(dirname "$key_path")"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
      - name: Build with Developer ID
        if: steps.signing.outputs.macos == 'developer-id'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          projectPath: apps/desktop
          tauriScript: npx tauri
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json -- --locked
          uploadUpdaterJson: false
          retryAttempts: 1
      # The DMG also needs its own notarization ticket before distribution.
      - name: Notarize and staple the DMG
        if: steps.signing.outputs.macos == 'developer-id'
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          dmg="$(ls apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg | head -1)"
          bash tools/release/notarize-dmg.sh "$dmg"
      - name: Build Windows bundles
        if: runner.os == 'Windows'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          projectPath: apps/desktop
          tauriScript: npx tauri
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json -- --locked
          uploadUpdaterJson: false
          retryAttempts: 1
      - name: Verify updater signatures before uploading artifacts
        shell: bash
        run: |
          count=0
          while IFS= read -r -d '' signature; do
            node tools/release/verify-updater-signature.mjs "${signature%.sig}"
            count=$((count + 1))
          done < <(find apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle -type f -name '*.sig' -print0)
          case "${{ matrix.target }}" in
            *-apple-darwin) test "$count" -ge 1 ;;
            *-pc-windows-msvc) test "$count" -ge 2 ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: cialai-packages-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi.sig
          if-no-files-found: error
          retention-days: 7
