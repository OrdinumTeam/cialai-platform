[package]
name = "cialai-broto-monitor"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
[features]
custom-protocol = ["tauri/custom-protocol"]
selftest = []

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }
[dependencies]
tauri = { version = "2.11.5", features = [] }
serde_json = "1"
dirs = "6"
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
tokio = { version = "1", features = ["net", "time", "io-util", "rt", "sync"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading"] }
