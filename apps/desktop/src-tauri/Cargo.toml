# SPDX-License-Identifier: Apache-2.0
[package]
name = "cialai-desktop"
version = "0.2.4"
description = "Cialai desktop terminal studio"
authors = ["Ordinum"]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[lib]
name = "cialai_desktop_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["macos-private-api"] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2.5.5"
tauri-plugin-window-state = "2.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
libc = "0.2"
base64 = "0.21"
getrandom = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["net", "time", "macros"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", features = ["sink"] }
sys-locale = "0.3"
which = "7"
dunce = "1"
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"
# Avisos de limite da Barra de IA, desligados por padrao.
tauri-plugin-notification = "2"
# O cache do Claude Desktop grava o corpo em zstd e nenhum dos tres sistemas
# traz decoder que um app assinado possa chamar.
zstd = "0.13"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
window-vibrancy = "0.8"
keepawake = "0.6.1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "objc2-core-foundation", "NSFileManager", "NSURL", "NSError", "NSString", "NSArray", "NSProcessInfo"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow", "NSScreen", "NSApplication", "NSEvent", "NSGraphicsContext", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSPasteboard", "NSImage", "NSWorkspace", "NSRunningApplication", "libc"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }
notify = "8"
sysinfo = "0.36.1"
trash = "5"
zbus = "5.13.2"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
notify = "8"
sysinfo = "0.36.1"
trash = "5"
windows-sys = { version = "0.61.2", features = ["Wdk_System_SystemServices", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# Um panic numa thread de apoio nao deve encerrar os terminais do processo.
strip = true
