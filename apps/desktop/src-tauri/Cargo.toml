# SPDX-License-Identifier: Apache-2.0
[package]
name = "cialai-desktop"
version = "0.1.0"
description = "Cialai desktop terminal studio"
authors = ["Ordinum"]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[lib]
name = "cialai_desktop_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["macos-private-api"] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
tauri-plugin-window-state = "2.4.1"
