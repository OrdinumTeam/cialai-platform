<!doctype html>
<html lang="pt-BR" data-shell="desktop">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Cialai</title>
    <!-- Estado inicial estático, antes de qualquer bundle. A janela do Windows
         nasce sem moldura e transparente, então, sem isto, uma página que não
         monta deixa um retângulo vazado, imóvel e sem botão de fechar. O fundo
         opaco da marca e a região de arraste ficam visíveis enquanto `#root`
         está vazio e somem sozinhos quando o React monta. -->
    <style>
      html, body { height: 100%; margin: 0; }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #37112F;
      }
      /* A assinatura oficial com as letras em branco, no lugar do nome em
         fonte do sistema. Gerada por tools/brand/build-ui-lockup.mjs. */
      #boot img { display: block; width: 180px; height: auto; user-select: none; -webkit-user-drag: none; }
      #root:not(:empty) ~ #boot { display: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" data-tauri-drag-region="deep" aria-hidden="true"><img src="./src/assets/boot-lockup.png" alt="" width="360" height="121" draggable="false" /></div>
    <script type="module" src="./src/desktop.jsx"></script>
  </body>
</html>
